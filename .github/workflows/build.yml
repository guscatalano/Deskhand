name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore & build (Release)
        run: dotnet build Deskhand.slnx -c Release --nologo

      - name: Build MSI
        run: pwsh installer/build-msi.ps1 -Config Release

      - name: Build MSIX (self-signed dev cert)
        run: pwsh installer/build-msix.ps1 -Config Release

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: deskhand-installers
          path: |
            installer/out/Deskhand.msi
            installer/out/Deskhand.msix
            installer/out/DeskhandDev.cer
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deskhand-installers
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Deskhand.msi
            dist/Deskhand.msix
            dist/DeskhandDev.cer
