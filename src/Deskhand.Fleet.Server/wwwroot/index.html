<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deskhand Fleet</title>
<style>
  :root {
    --bg:#F1F4F7; --surface:#FFFFFF; --surface-2:#E7ECF1; --surface-3:#DCE3EA;
    --ink:#10161D; --ink-2:#45515F; --ink-3:#6C7885; --line:#CFD8E0; --line-2:#E2E8EE;
    --accent:#0C7F86; --accent-soft:#D6ECEC; --action:#B44311;
    --good:#197C50; --good-soft:#D9EEE3; --crit:#AE2A1C; --crit-soft:#F6DAD5; --warn:#9A5A08; --warn-soft:#F6E7CF;
    --mono:"Cascadia Code","Consolas",ui-monospace,monospace; --sans:"Segoe UI",system-ui,-apple-system,sans-serif;
    --shadow:0 1px 2px rgba(16,22,29,.06),0 8px 24px rgba(16,22,29,.06);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0A0E12; --surface:#10161C; --surface-2:#171F27; --surface-3:#1E2831;
    --ink:#E8EDF2; --ink-2:#A6B2BE; --ink-3:#76828F; --line:#232E38; --line-2:#1A232B;
    --accent:#24BABF; --accent-soft:#12312F; --action:#EB824B;
    --good:#37B87F; --good-soft:#123027; --crit:#EF7A6C; --crit-soft:#331916; --warn:#D79A3E; --warn-soft:#2E2413;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
  }}
  :root[data-theme="dark"]{
    --bg:#0A0E12; --surface:#10161C; --surface-2:#171F27; --surface-3:#1E2831;
    --ink:#E8EDF2; --ink-2:#A6B2BE; --ink-3:#76828F; --line:#232E38; --line-2:#1A232B;
    --accent:#24BABF; --accent-soft:#12312F; --action:#EB824B;
    --good:#37B87F; --good-soft:#123027; --crit:#EF7A6C; --crit-soft:#331916; --warn:#D79A3E; --warn-soft:#2E2413;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:11px 18px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:9px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;font-size:12px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--ink-3);box-shadow:0 0 0 4px var(--surface-2);transition:.25s;}
  .brand .dot.live{background:var(--good);box-shadow:0 0 0 4px var(--good-soft);}
  .brand b{font-weight:700;letter-spacing:.2em;}
  .spacer{flex:1;}
  .stat{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);}
  .ghost{color:var(--ink-2);background:var(--surface);border:1px solid var(--line);padding:6px 11px;border-radius:7px;cursor:pointer;font-family:var(--mono);font-size:11.5px;}
  .ghost:hover{border-color:var(--accent);color:var(--ink);}
  .pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;padding:2px 9px;border-radius:20px;text-transform:uppercase;font-weight:600;}
  .pill.default{color:var(--good);background:var(--good-soft);} .pill.secure,.pill.locked{color:var(--crit);background:var(--crit-soft);} .pill.unknown{color:var(--warn);background:var(--warn-soft);}

  main{max-width:1400px;margin:0 auto;padding:18px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:.15s;}
  .card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .thumb{aspect-ratio:16/9;background:var(--surface-3);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .ph{color:var(--ink-3);font-family:var(--mono);font-size:11px;}
  .card .meta{padding:11px 14px;display:flex;flex-direction:column;gap:5px;}
  .card .name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;}
  .card .sub{font-family:var(--mono);font-size:11px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap;}
  .empty{color:var(--ink-3);font-family:var(--mono);font-size:13px;text-align:center;padding:80px 20px;}

  /* detail */
  #detail{display:none;}
  #detail.show{display:block;}
  .subtabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:16px 0 0;}
  .subtab{background:none;border:none;border-bottom:2px solid transparent;color:var(--ink-3);padding:7px 11px;cursor:pointer;font:inherit;font-size:12.5px;}
  .subtab.active{color:var(--ink);border-bottom-color:var(--accent);}
  .subpane{padding-top:12px;}
  .afrow{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;font-family:var(--mono);font-size:12px;}
  .afrow:hover{background:var(--surface-2);}
  .afrow .an{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .afrow.dir .an{cursor:pointer;color:var(--accent);}
  .afrow a{cursor:pointer;color:var(--accent);font-size:11px;}
  .afrow a.danger{color:var(--action,#d9822b);}
  .dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .dhead h1{font-size:20px;margin:0;letter-spacing:-.01em;}
  .viewer{position:relative;background:var(--surface-3);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:200px;box-shadow:var(--shadow);}
  .viewer img{max-width:100%;height:auto;display:block;cursor:crosshair;}
  .viewer .marker{position:absolute;width:14px;height:14px;border:2px solid var(--action);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--action) 30%,transparent);}
  .ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0;}
  .ctrls label{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);}
  input[type=text],select{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:6px 9px;font-family:var(--sans);font-size:13px;}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .btn{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;}
  .btn:hover{border-color:var(--accent);}
  .btn.a{background:var(--action);border-color:var(--action);color:#fff;}
  .coord{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);} .coord b{color:var(--accent);}
  .hint{font-size:11.5px;color:var(--ink-3);margin-top:6px;}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-family:var(--mono);font-size:12px;z-index:50;box-shadow:var(--shadow);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.err{background:var(--crit);color:#fff;}
  #auditdrawer{position:fixed;right:14px;bottom:14px;width:min(560px,94vw);max-height:54vh;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:none;flex-direction:column;z-index:40;overflow:hidden;}
  #auditdrawer.show{display:flex;}
  #auditdrawer header{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line-2);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);}
  #auditlist{overflow:auto;font-family:var(--mono);font-size:11px;padding:4px 8px;display:flex;flex-direction:column-reverse;}
  .arow{display:grid;grid-template-columns:80px 130px 1fr;gap:8px;padding:3px 2px;border-bottom:1px solid var(--line-2);}
  .arow .k{font-weight:700;} .arow .k.connect{color:var(--good);} .arow .k.disconnect{color:var(--crit);} .arow .k.action{color:var(--accent);}
  .arow .ag{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .arow .dt{color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
</style>
</head>
<body>

<div class="topbar">
  <span class="brand"><span class="dot" id="dot"></span><b>Deskhand</b> Fleet</span>
  <span class="stat" id="count"></span>
  <span class="spacer"></span>
  <button class="ghost" id="backBtn" style="display:none">← All PCs</button>
  <a class="ghost" style="text-decoration:none" href="http://localhost:8791/" target="_blank" title="Full local dashboard of the machine running THIS fleet server (not the selected agent — remote agents have no web UI of their own)">⌂ This server's console →</a>
  <button class="ghost" id="rdpBtn" title="Add a machine to the fleet over RDP (no agent installed on the target)">＋ RDP</button>
  <button class="ghost danger-on" id="pauseBtn" title="Live screenshots are OFF by default — click to start polling agent screens">▶ Go live</button>
  <button class="ghost" id="auditBtn" title="Who connected & what they did">Audit</button>
  <button class="ghost" id="refreshBtn">Refresh</button>
  <button class="ghost" id="themeBtn">Theme</button>
</div>

<main>
  <div id="grid" class="grid"></div>
  <div id="detail"></div>
</main>
<div id="toast"></div>
<div id="auditdrawer"><header>Fleet audit — who connected &amp; what they did<span style="flex:1"></span><span id="auditdir" style="font-family:var(--mono);font-size:9px;color:var(--ink-3)"></span></header><div id="auditlist"></div></div>

<div id="rdpModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;align-items:center;justify-content:center">
  <div style="background:var(--surface,#151b22);border:1px solid var(--line,#2a3440);border-radius:12px;padding:18px 20px;width:340px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.5)">
    <div style="font-weight:600;margin-bottom:4px">Add a machine over RDP</div>
    <div style="font-size:11px;color:var(--ink-3,#8a97a5);margin-bottom:12px">Connects over RDP and joins the fleet — nothing installed on the target. Capture + input only (no UIA).</div>
    <div style="display:grid;gap:8px">
      <input id="rdpHost" placeholder="host / IP (e.g. 10.0.0.5)">
      <input id="rdpUser" placeholder="username">
      <input id="rdpPass" type="password" placeholder="password">
      <div style="display:flex;gap:8px">
        <input id="rdpDomain" placeholder="domain (optional)" style="flex:1">
        <input id="rdpSize" placeholder="1920x1080" style="width:110px">
      </div>
      <input id="rdpId" placeholder="fleet name (optional, defaults to host)">
    </div>
    <div id="rdpMsg" style="font-size:11px;color:var(--ink-3,#8a97a5);margin:10px 0 4px;min-height:14px"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
      <button class="ghost" id="rdpCancel">Cancel</button>
      <button class="btn" id="rdpConnect">Connect</button>
    </div>
  </div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s), elm=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
let toastT; function toast(m,err){const t=$("#toast");t.textContent=m;t.className="show"+(err?" err":"");clearTimeout(toastT);toastT=setTimeout(()=>t.className="",2200);}
function guard(fn){return async(...a)=>{try{await fn(...a)}catch(e){toast(e.message||"error",true)}};}
/* Fleet token: needed only when the server is bound to the network (DESKHAND_FLEET_BIND=any).
   Read once from ?token= then scrubbed from the URL bar; empty on loopback. */
let AUTH_TOKEN="";
(function(){try{const u=new URL(location.href);const t=u.searchParams.get("token");
  if(t){AUTH_TOKEN=t;try{sessionStorage.setItem("deskhand_fleet_token",t)}catch{}
        u.searchParams.delete("token");history.replaceState(null,"",u.pathname+u.search+u.hash);}
  else{try{AUTH_TOKEN=sessionStorage.getItem("deskhand_fleet_token")||""}catch{}}}catch{}})();
async function api(path,method="GET",body){
  const headers=body?{"Content-Type":"application/json"}:{};
  if(AUTH_TOKEN) headers["Authorization"]="Bearer "+AUTH_TOKEN;
  const r=await fetch(path,{method,headers,body:body?JSON.stringify(body):undefined});
  const txt=await r.text(); let d; try{d=txt?JSON.parse(txt):null}catch{d=txt}
  if(r.status===401 && !AUTH_TOKEN){const t=prompt("This fleet server is exposed to the network and needs its token:");
    if(t){AUTH_TOKEN=t.trim();try{sessionStorage.setItem("deskhand_fleet_token",AUTH_TOKEN)}catch{}return api(path,method,body);}}
  if(!r.ok) throw new Error((d&&d.error)||r.statusText);
  return d;
}

let agents=[]; let detailTimer=null; let gridTimer=null; let current=null; let lastCap=null; let rdpIds=new Set();

async function loadAgents(){
  agents = await api("/agents");
  try{ const rl=await api("/fleet/rdp/list"); rdpIds=new Set(rl.map(x=>x.id)); }catch{ /* keep last known */ }
  $("#dot").classList.add("live");
  $("#count").textContent = `${agents.length} PC${agents.length===1?"":"s"} connected`;
  if(!current) renderGrid();
}

// Disconnect an RDP-added machine (kills its connector; it drops off on the next /agents poll).
const removeRdp=guard(async(id)=>{
  if(!confirm(`Disconnect RDP machine "${id}"?\nThis stops its RDP connector and removes it from the fleet.`)) return;
  await api("/fleet/rdp/disconnect","POST",{id});
  toast("RDP machine disconnected");
  if(current&&current.id===id){ current=null; clearInterval(detailTimer); }
  await loadAgents(); renderGrid();
});

function renderGrid(){
  $("#detail").classList.remove("show"); $("#backBtn").style.display="none";
  const g=$("#grid"); g.style.display="grid";
  if(!agents.length){ g.innerHTML='<div class="empty">No PCs connected. Start <b>deskhand-agent</b> on a machine pointing at this server.</div>'; return; }
  // keep existing cards where possible to avoid thumbnail flicker
  const have=new Set([...g.querySelectorAll('.card')].map(c=>c.dataset.id));
  const want=new Set(agents.map(a=>a.id));
  [...g.querySelectorAll('.card')].forEach(c=>{ if(!want.has(c.dataset.id)) c.remove(); });
  agents.forEach(a=>{
    if(have.has(a.id)) return;
    const card=elm("div","card"); card.dataset.id=a.id; card.style.position="relative";
    const rdpBadge = rdpIds.has(a.id) ? ' <span class="pill" style="background:#3a6ea5">RDP</span>' : '';
    card.innerHTML=`<div class="thumb"><div class="ph">loading…</div></div>
      <div class="meta"><div class="name">${a.machine} <span class="pill ${a.desktop}">${a.desktop}</span>${rdpBadge}</div>
      <div class="sub"><span>id: ${a.id}</span><span>${a.monitors} monitor${a.monitors===1?"":"s"}</span>${a.elevated?"<span>elevated</span>":""}</div></div>`;
    card.onclick=()=>openAgent(a);
    if(rdpIds.has(a.id)){ const rm=elm("button"); rm.textContent="✕"; rm.title="Disconnect this RDP machine";
      rm.style.cssText="position:absolute;top:6px;right:6px;z-index:2;width:22px;height:22px;border-radius:6px;border:none;background:rgba(160,40,40,.85);color:#fff;cursor:pointer;font-size:12px;line-height:1";
      rm.onclick=(e)=>{ e.stopPropagation(); removeRdp(a.id); }; card.appendChild(rm); }
    g.appendChild(card);
  });
}

// Live screenshot polling captures the remote screens. OFF by default: nothing is screenshotted until
// the operator clicks "Go live". Also auto-pauses whenever this page isn't visible. Opening a single
// agent still fetches one frame (explicit intent), but continuous polling stays off until Go live.
let paused=true;
function liveOn(){ return !paused && !document.hidden; }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && liveOn()){ if(current) refreshView().catch(()=>{}); else thumbAll().catch(()=>{}); } });

async function thumbAll(){
  if(current || !liveOn()) return;
  for(const a of agents){
    try{
      const c=await api(`/agents/${a.id}/capture/screen`,"POST",{format:"jpeg"});
      const card=document.querySelector(`.card[data-id="${a.id}"] .thumb`);
      if(card){ card.innerHTML=""; const img=new Image(); img.src=`data:image/jpeg;base64,${c.imageBase64}`; card.appendChild(img); }
    }catch{}
  }
}

const openAgent = guard(async(a)=>{
  current=a;
  history.replaceState(null,"","#agent="+encodeURIComponent(a.id));   // deep-link the machine
  $("#grid").style.display="none";
  $("#backBtn").style.display="";
  const info=await api(`/agents/${a.id}/machine`);
  const d=$("#detail"); d.classList.add("show");
  const mons=info.monitors||[];
  d.innerHTML=`
    <div class="dhead"><h1>${a.machine}</h1><span class="pill ${a.desktop}">${a.desktop}</span>
      ${rdpIds.has(a.id)?'<span class="pill" style="background:#3a6ea5">RDP</span>':''}
      <span class="stat">${info.userName||""} · ${mons.length} monitor${mons.length===1?"":"s"}</span>
      <span class="spacer" style="flex:1"></span>
      ${rdpIds.has(a.id)?'<button class="btn" id="rmRdpBtn" style="background:rgba(160,40,40,.9)">✕ Disconnect RDP</button>':''}</div>
    <div class="ctrls">
      <label>monitor</label>
      <select id="monSel"><option value="">all</option>${mons.map(m=>`<option value="${m.index}"${m.primary?" selected":""}>#${m.index}${m.primary?" (primary)":""} ${m.bounds.width}×${m.bounds.height}</option>`).join("")}</select>
      <label>on click</label>
      <select id="clickAction"><option value="inspect">read coords</option>${rdpIds.has(a.id)?"":'<option value="pick">🔍 pick element</option>'}<option value="left">left click</option><option value="right">right click</option><option value="double">double click</option><option value="move">move</option></select>
      <span class="coord" id="coord">live view — click to control</span>
      <span class="spacer" style="flex:1"></span>
      <button class="btn" id="saveBtn" title="Save the current frame">⬇ Save</button>
    </div>
    ${rdpIds.has(a.id)?'<div style="font-size:11px;color:var(--ink-3);background:rgba(58,110,165,.12);border:1px solid rgba(58,110,165,.35);border-radius:7px;padding:6px 10px;margin:0 0 8px;display:flex;align-items:center;gap:10px"><span style="flex:1">🖧 <b>RDP</b> — capture + coordinate input only (no accessibility tree). Install the <b>native agent</b> on this machine for the full console (Explorer, processes, recording, hooks).</span><button class="btn" id="rdpInstallBtn" title="Bootstrap the native agent onto the remote over this RDP session">⬇ Install native agent</button></div>':''}
    <div class="viewer" id="viewer"><div class="marker" id="marker" style="display:none"></div></div>
    <div class="ctrls">
      <input type="text" id="typeTxt" placeholder="type text on this PC…" style="flex:1;min-width:160px"><button class="btn a" id="typeBtn">Type</button>
      <input type="text" id="keysTxt" placeholder="ctrl+a · enter · alt+F4" style="width:180px"><button class="btn a" id="keysBtn">Send keys</button>
    </div>
    <div class="hint">Live view refreshes ~2s. Coordinates map to the captured monitor; input is injected on the remote PC (governed on the agent).</div>
    ${rdpIds.has(a.id)?"":`
    <div class="subtabs">
      <button class="subtab active" data-sub="files">Files</button>
      <button class="subtab" data-sub="shell">Shell</button>
      <button class="subtab" data-sub="system">System</button>
      <button class="subtab" data-sub="firewall">Firewall</button>
    </div>
    <div id="subFiles" class="subpane">
      <div class="ctrls"><input id="afPath" placeholder="C:\\Users" style="flex:1;font-family:var(--mono)"><button class="btn" id="afGo">Go</button><button class="btn" id="afUp">↑ up</button><button class="btn a" id="afUpBtn">⬆ Upload</button><input type="file" id="afUpload" multiple hidden></div>
      <div id="afCrumb" style="font-family:var(--mono);font-size:11px;color:var(--ink-3);margin:8px 0"></div>
      <div id="afBody"></div>
    </div>
    <div id="subShell" class="subpane" style="display:none">
      <div class="ctrls"><select id="asShell"><option value="powershell">PowerShell</option><option value="pwsh">pwsh</option><option value="cmd">cmd</option></select><input id="asCmd" placeholder="command… (Enter to run)" style="flex:1;font-family:var(--mono)"><button class="btn a" id="asRun">Run</button></div>
      <div id="asMeta" style="font-family:var(--mono);font-size:11px;color:var(--ink-3);margin:8px 0 4px"></div>
      <pre id="asOut" style="background:var(--surface-3);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;word-break:break-word;max-height:40vh;overflow:auto;margin:0"></pre>
    </div>
    <div id="subSystem" class="subpane" style="display:none">
      <button class="btn" id="asysLoad">↻ Load system info</button>
      <div id="asysBody" style="margin-top:10px;font-family:var(--mono);font-size:12px"></div>
    </div>
    <div id="subFirewall" class="subpane" style="display:none">
      <div class="ctrls"><input id="afwPort" type="number" min="1" max="65535" placeholder="port" style="max-width:90px;font-family:var(--mono)"><select id="afwProto"><option value="tcp">TCP</option><option value="udp">UDP</option></select><select id="afwDir"><option value="in">Inbound</option><option value="out">Outbound</option></select><input id="afwName" placeholder="name (optional)" style="max-width:150px"><button class="btn a" id="afwOpen">＋ Open port</button></div>
      <div class="ctrls" style="margin-top:6px"><select id="afwFltDir"><option value="">All dir</option><option value="in">Inbound</option><option value="out">Outbound</option></select><input id="afwFltPort" type="number" placeholder="port" style="max-width:80px;font-family:var(--mono)"><input id="afwFltText" placeholder="name contains…" style="flex:1"><label style="display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-3)"><input type="checkbox" id="afwFltManaged"> Deskhand only</label><button class="btn" id="afwRefresh">Refresh</button></div>
      <div class="hint" style="margin:6px 0">Opening/closing needs the agent started with <b>DESKHAND_ENABLE_FIREWALL_ADMIN</b> + Administrator. Deskhand only ever closes rules it opened.</div>
      <div id="afwMeta" style="font-family:var(--mono);font-size:11px;color:var(--ink-3);margin:4px 0"></div>
      <div id="afwBody"></div>
    </div>
    <div class="hint" style="margin-top:6px">Files / Shell / System run on this agent PC. Shell needs the agent started with DESKHAND_ENABLE_SHELL. (Not available on RDP connectors.)</div>`}`;
  { const rb=$("#rmRdpBtn"); if(rb) rb.onclick=()=>removeRdp(a.id); }
  { const ib=$("#rdpInstallBtn"); if(ib) ib.onclick=guard(async()=>{
      if(!confirm("Install the native agent on "+a.machine+" over RDP?\nThis drives the remote Run dialog to launch the agent from \\\\tsclient. It reconnects as a full native agent.")) return;
      ib.disabled=true; ib.textContent="installing…";
      try{ const r=await api("/fleet/rdp/install","POST",{id:a.id}); toast("bootstrap sent — watch for a native agent to appear"); $("#coord").innerHTML=`sent to remote: <code>${r.launched||"ok"}</code>`; }
      finally{ ib.disabled=false; ib.textContent="⬇ Install native agent"; }
    }); }
  $("#monSel").onchange=()=>refreshView(true);
  $("#viewer").addEventListener("click", guard(onViewClick));
  $("#typeBtn").onclick=guard(async()=>{ await api(`/agents/${a.id}/keyboard/type`,"POST",{text:$("#typeTxt").value}); toast("typed"); });
  $("#keysBtn").onclick=guard(async()=>{ await api(`/agents/${a.id}/keyboard/keys`,"POST",{chord:$("#keysTxt").value}); toast("sent"); });
  $("#saveBtn").onclick=()=>{ const img=$("#viewer img"); if(!img){toast("no frame yet",true);return;} const dl=document.createElement("a"); dl.href=img.src; const ts=new Date().toISOString().replace(/[:.]/g,"-").slice(0,19); dl.download=`${a.machine}-${ts}.jpg`; document.body.appendChild(dl); dl.click(); dl.remove(); toast("saved"); };
  if(!rdpIds.has(a.id)) wireAgentPanels(a.id);
  await refreshView(true);   // one frame on open (explicit intent); continuous polling stays off until Go live
  clearInterval(detailTimer); detailTimer=setInterval(()=>refreshView().catch(()=>{}), 2200);
});

// Files / Shell / System sub-panels for a native agent (they call /agents/{id}/fs|shell|system).
function wireAgentPanels(id){
  let afwLoaded=false;
  document.querySelectorAll(".subtab").forEach(b=>b.onclick=()=>{
    document.querySelectorAll(".subtab").forEach(x=>x.classList.remove("active")); b.classList.add("active");
    $("#subFiles").style.display=b.dataset.sub==="files"?"":"none";
    $("#subShell").style.display=b.dataset.sub==="shell"?"":"none";
    $("#subSystem").style.display=b.dataset.sub==="system"?"":"none";
    $("#subFirewall").style.display=b.dataset.sub==="firewall"?"":"none";
    if(b.dataset.sub==="firewall"&&!afwLoaded){ afwLoaded=true; loadAfw(); }
  });
  // ---- files ----
  let afCur="";
  const loadAf=guard(async(p)=>{
    const d=await api(`/agents/${id}/fs?path=`+encodeURIComponent(p||""));
    afCur=d.isRoot?"":(d.path||""); $("#afPath").value=afCur; $("#afUpBtn").disabled=!!d.isRoot;
    $("#afCrumb").textContent=afCur||"This PC — drives";
    const body=$("#afBody"); body.innerHTML="";
    if(d.error){ body.innerHTML='<div style="color:var(--crit);padding:8px">'+d.error+'</div>'; return; }
    (d.entries||[]).forEach(e=>{
      const row=elm("div","afrow"+(e.isDirectory?" dir":""));
      const nm=elm("div","an"); nm.textContent=(e.isDirectory?"▸ ":"· ")+e.name; if(e.isDirectory) nm.onclick=()=>loadAf(e.path); row.append(nm);
      if(!e.isDirectory){ const dl=elm("a"); dl.textContent="download"; dl.onclick=()=>agentDownload(id,e.path,e.name); row.append(dl); }
      if(!d.isRoot){ const del=elm("a"); del.className="danger"; del.textContent="delete"; del.onclick=guard(async()=>{ if(!confirm("Delete "+e.name+" on "+id+"?")) return; const r=await api(`/agents/${id}/fs/delete`,"POST",{path:e.path}); toast(r.ok?"deleted":r.error||"error",!r.ok); loadAf(afCur); }); row.append(del); }
      body.append(row);
    });
    if(!(d.entries||[]).length) body.innerHTML='<div style="color:var(--ink-3);padding:6px">(empty)</div>';
  });
  $("#afGo").onclick=()=>loadAf($("#afPath").value.trim());
  $("#afPath").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#afGo").click(); });
  $("#afUp").onclick=()=>{ if(afCur) loadAf(afCur.replace(/\\+$/,"").split("\\").slice(0,-1).join("\\")); };
  $("#afUpBtn").onclick=()=>$("#afUpload").click();
  $("#afUpload").onchange=guard(async()=>{
    const files=$("#afUpload").files; if(!files.length||!afCur) return;
    const fd=new FormData(); fd.append("dir",afCur); for(const f of files) fd.append("files",f);
    const h={}; if(AUTH_TOKEN) h["Authorization"]="Bearer "+AUTH_TOKEN;
    const r=await fetch(`/agents/${id}/fs/upload`,{method:"POST",headers:h,body:fd}); $("#afUpload").value="";
    if(!r.ok){ toast("upload failed",true); return; } toast("uploaded"); loadAf(afCur);
  });
  loadAf("");
  // ---- shell ----
  const runAsh=guard(async()=>{
    const cmd=$("#asCmd").value; if(!cmd.trim()) return; $("#asMeta").textContent="running…";
    try{ const r=await api(`/agents/${id}/shell/run`,"POST",{shell:$("#asShell").value,command:cmd});
      $("#asMeta").textContent=r.timedOut?"timed out":`exit ${r.exitCode} · ${r.durationMs} ms`;
      $("#asOut").textContent=(r.stdout||"")+(r.stderr?("\n"+r.stderr):"")+((r.error&&!r.stderr&&!r.timedOut)?("\n"+r.error):"")||"(no output)";
    }catch(e){ $("#asMeta").textContent=e.message; $("#asOut").textContent=""; }
  });
  $("#asRun").onclick=runAsh; $("#asCmd").addEventListener("keydown",e=>{ if(e.key==="Enter") runAsh(); });
  // ---- system ----
  $("#asysLoad").onclick=guard(async()=>{ $("#asysBody").textContent="loading…"; const s=await api(`/agents/${id}/system`); $("#asysBody").innerHTML=renderAgentSys(s); });
  // ---- firewall ----
  const fwEsc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const loadAfw=guard(async()=>{
    const qs=new URLSearchParams();
    const dir=$("#afwFltDir").value; if(dir) qs.set("direction",dir);
    const port=$("#afwFltPort").value.trim(); if(port) qs.set("port",port);
    const txt=$("#afwFltText").value.trim(); if(txt) qs.set("contains",txt);
    if($("#afwFltManaged").checked) qs.set("managedOnly","true");
    qs.set("max","400");
    const d=await api(`/agents/${id}/firewall/rules?`+qs.toString());
    $("#afwMeta").textContent=d.error?d.error:`showing ${d.returned} of ${d.total} rules`;
    const body=$("#afwBody"); body.innerHTML="";
    if(!(d.rules||[]).length){ body.innerHTML='<div style="color:var(--ink-3);padding:6px">No rules match.</div>'; return; }
    d.rules.forEach(r=>{
      const row=elm("div","afrow"); row.style.gridTemplateColumns="1fr auto";
      const nm=elm("div","an");
      nm.innerHTML=(r.enabled?"":"<span style='opacity:.45'>○ </span>")+fwEsc(r.name)
        +' <span style="color:var(--ink-3);font-size:11px">'+r.direction+" · "+fwEsc(r.protocol||"—")+" "+fwEsc(r.localPorts||"")
        +" · "+(r.action==="Block"?'<span style="color:var(--crit)">Block</span>':'<span style="color:var(--good)">Allow</span>')
        +(r.managed?' · <b style="color:var(--accent)">Deskhand</b>':"")+"</span>";
      row.append(nm);
      if(r.managed && /^\d+$/.test(r.localPorts||"")){
        const cl=elm("a"); cl.className="danger"; cl.textContent="close";
        cl.onclick=guard(async()=>{ await api(`/agents/${id}/firewall/close`,"POST",{port:parseInt(r.localPorts,10),protocol:(r.protocol||"tcp").toLowerCase(),direction:r.direction}); toast("closed "+r.protocol+" "+r.localPorts); loadAfw(); });
        row.append(cl);
      }
      body.append(row);
    });
  });
  $("#afwRefresh").onclick=loadAfw;
  ["afwFltDir","afwFltManaged"].forEach(x=>$("#"+x).addEventListener("change",loadAfw));
  ["afwFltPort","afwFltText"].forEach(x=>$("#"+x).addEventListener("keydown",e=>{ if(e.key==="Enter") loadAfw(); }));
  $("#afwOpen").onclick=guard(async()=>{
    const port=parseInt($("#afwPort").value,10); if(!(port>=1&&port<=65535)){ toast("enter a port (1–65535)",true); return; }
    const b={port,protocol:$("#afwProto").value,direction:$("#afwDir").value}; const nm=$("#afwName").value.trim(); if(nm) b.name=nm;
    const r=await api(`/agents/${id}/firewall/open`,"POST",b);
    toast(r.ok?("opened "+r.protocol+" "+r.port):("failed: "+(r.error||"")+(r.hint?" — "+r.hint:"")),!r.ok);
    $("#afwPort").value=""; $("#afwName").value=""; $("#afwFltManaged").checked=true; loadAfw();
  });
}
async function agentDownload(id,path,name){
  const h={}; if(AUTH_TOKEN) h["Authorization"]="Bearer "+AUTH_TOKEN;
  const r=await fetch(`/agents/${id}/fs/download?path=`+encodeURIComponent(path),{headers:h});
  if(!r.ok){ toast("download failed",true); return; }
  const b=await r.blob(); const u=URL.createObjectURL(b); const el=document.createElement("a"); el.href=u; el.download=name; document.body.append(el); el.click(); el.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000);
}
function renderAgentSys(d){
  const kv=(k,v)=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:2px 0;border-bottom:1px solid var(--line-2,rgba(128,128,128,.2))"><span style="color:var(--ink-3)">${k}</span><span style="text-align:right;word-break:break-word">${v==null||v===""?"—":v}</span></div>`;
  const gb=n=>(n/1073741824).toFixed(1)+" GB";
  const disks=(d.disks||[]).filter(x=>x.totalSize>0).map(x=>x.name+" "+gb(x.usedSize)+"/"+gb(x.totalSize)).join(" · ");
  const net=(d.network||[]).map(n=>n.name+": "+((n.iPv4||[]).join(",")||"—")).join(" | ");
  const fw=d.firewall||{};
  return kv("OS",d.os.name+" "+d.os.displayVersion+" (build "+d.os.build+")")+kv("BuildLab",d.os.buildLab)+kv("Uptime",d.time.uptime)+kv("CPU",d.cpu.name+" · "+(d.cpu.loadPercent!=null?d.cpu.loadPercent+"%":"")+" · "+d.cpu.logicalProcessors+" cores")+kv("Memory",gb(d.memory.usedPhysical)+" / "+gb(d.memory.totalPhysical)+" ("+d.memory.loadPercent+"%)")+kv("Disks",disks)+kv("Network",net)+kv("Firewall","dom "+fw.domainEnabled+" · priv "+fw.privateEnabled+" · pub "+fw.publicEnabled);
}

async function refreshView(force){
  if(!current || (!liveOn() && !force)) return;
  const mon=$("#monSel")?.value;
  const body={format:"jpeg"}; if(mon!=="") body.monitor=Number(mon);
  const c=await api(`/agents/${current.id}/capture/screen`,"POST",body);
  lastCap={rect:c.rect};
  const v=$("#viewer"); let img=v.querySelector("img");
  if(!img){ img=new Image(); v.insertBefore(img,$("#marker")); }
  img.src=`data:image/jpeg;base64,${c.imageBase64}`;
}

async function onViewClick(ev){
  const img=$("#viewer img"); if(!img||!lastCap) return;
  const r=img.getBoundingClientRect(); const fx=(ev.clientX-r.left)/r.width, fy=(ev.clientY-r.top)/r.height;
  const dx=Math.round(lastCap.rect.x+fx*lastCap.rect.width), dy=Math.round(lastCap.rect.y+fy*lastCap.rect.height);
  const mk=$("#marker"); mk.style.display="block"; mk.style.left=(fx*100)+"%"; mk.style.top=(fy*100)+"%";
  $("#coord").innerHTML=`desktop <b>${dx}, ${dy}</b>`;
  const a=$("#clickAction").value;
  if(a==="pick"){
    const el=await api(`/agents/${current.id}/uia/element-from-point`,"POST",{x:dx,y:dy});
    const nm=el.name?`"${el.name}"`:"(no name)";
    $("#coord").innerHTML=`@ <b>${dx}, ${dy}</b> → <b>${el.controlType}</b> ${nm} <span style="opacity:.6">${el.className||""}</span> · ref <code>${el.ref}</code>`;
    toast(`picked ${el.controlType}`);
  }
  else if(a==="move"){ await api(`/agents/${current.id}/mouse/move`,"POST",{x:dx,y:dy}); toast("moved"); await refreshView(true); }
  else if(a==="left"){ await api(`/agents/${current.id}/mouse/click`,"POST",{button:"left",x:dx,y:dy,count:1}); toast("click"); await refreshView(true); }
  else if(a==="right"){ await api(`/agents/${current.id}/mouse/click`,"POST",{button:"right",x:dx,y:dy,count:1}); toast("right click"); await refreshView(true); }
  else if(a==="double"){ await api(`/agents/${current.id}/mouse/click`,"POST",{button:"left",x:dx,y:dy,count:2}); toast("double"); await refreshView(true); }
}

$("#backBtn").onclick=()=>{ current=null; clearInterval(detailTimer); history.replaceState(null,"","#"); renderGrid(); thumbAll(); };
$("#refreshBtn").onclick=guard(async()=>{ await loadAgents(); if(!current) await thumbAll(); });
$("#themeBtn").onclick=()=>{ const r=document.documentElement; const dark=r.getAttribute("data-theme")?r.getAttribute("data-theme")==="dark":matchMedia("(prefers-color-scheme: dark)").matches; r.setAttribute("data-theme",dark?"light":"dark"); };

// On load, reopen the machine named in the URL hash (#agent=<id>) so a refresh returns to it.
function restoreFromHash(){
  const m=(location.hash||"").match(/^#agent=(.+)$/);
  if(m){ const id=decodeURIComponent(m[1]); const a=agents.find(x=>x.id===id); if(a){ openAgent(a); return; } }
  if(!current) thumbAll();
}
loadAgents().then(restoreFromHash).catch(()=>{ $("#count").textContent="server unreachable"; });
gridTimer=setInterval(()=>{ loadAgents().catch(()=>{}); if(!current) thumbAll(); }, 5000);

/* ---------- fleet audit ---------- */
let auditSince=0;
$("#pauseBtn").onclick=()=>{ paused=!paused; $("#pauseBtn").textContent=paused?"▶ Go live":"⏸ Pause live"; $("#pauseBtn").classList.toggle("danger-on",paused);
  if(!paused){ if(current) refreshView().catch(()=>{}); else thumbAll().catch(()=>{}); } };
// ---- add a machine over RDP (spawns the connector on the server) ----
$("#rdpBtn").onclick=()=>{ $("#rdpModal").style.display="flex"; $("#rdpMsg").textContent=""; $("#rdpHost").focus(); };
$("#rdpCancel").onclick=()=>{ $("#rdpModal").style.display="none"; };
$("#rdpModal").addEventListener("click",e=>{ if(e.target.id==="rdpModal") $("#rdpModal").style.display="none"; });
$("#rdpConnect").onclick=guard(async()=>{
  const host=$("#rdpHost").value.trim(), user=$("#rdpUser").value.trim(), password=$("#rdpPass").value;
  if(!host||!user){ $("#rdpMsg").textContent="host and username are required."; return; }
  $("#rdpMsg").textContent="starting RDP connector…";
  try{
    const c=await api("/fleet/rdp/connect","POST",{host,user,password,domain:$("#rdpDomain").value.trim()||null,size:$("#rdpSize").value.trim()||null,id:$("#rdpId").value.trim()||null});
    $("#rdpMsg").innerHTML=`connector <b>${c.id}</b> started (pid ${c.pid}). It will appear as a tile once RDP connects…`;
    $("#rdpPass").value="";
    toast("RDP connector started");
    setTimeout(()=>{ $("#rdpModal").style.display="none"; loadAgents().catch(()=>{}); },2500);
  }catch(e){ $("#rdpMsg").textContent="failed: "+e.message; }
});
$("#auditBtn").onclick=()=>$("#auditdrawer").classList.toggle("show");
async function pollAudit(){
  try{
    const r=await api(`/fleet/audit?since=${auditSince}`);
    if(r.dir && !$("#auditdir").textContent) $("#auditdir").textContent=r.dir;
    (r.entries||[]).forEach(e=>{
      const row=elm("div","arow");
      const kind=e.kind.replace("agent_","");
      const k=elm("span","k "+kind); k.textContent=kind;
      const ag=elm("span","ag"); ag.textContent=(e.agent||"—")+(e.client?` · ${e.client}`:"");
      const dt=elm("span","dt"); dt.textContent=e.detail||"";
      $("#auditlist").append(row); row.append(k,ag,dt);
      while($("#auditlist").children.length>400) $("#auditlist").firstChild.remove();
    });
    if(r.entries && r.entries.length) auditSince=r.lastId;
  }catch{}
}
pollAudit(); setInterval(pollAudit, 3000);
</script>
